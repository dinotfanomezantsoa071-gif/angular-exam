<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1>Livreurs</h1>
      <a sec:authorize="hasAnyRole(&#x27;ADMIN&#x27;,&#x27;MANAGER&#x27;,&#x27;OPERATOR&#x27;)" th:href="@{/deliverers/new}">Ajouter</a>
      <form method="get">
        <label>
          Recherche
          <input name="q" placeholder="Rechercher" th:value="${q}">
        </label>
        <label>
          Statut
          <select name="status">
            <option value="">Tous</option>
            <option value="DISPONIBLE" th:selected="${status == &#x27;DISPONIBLE&#x27;}">Disponible</option>
            <option value="EN_LIVRAISON" th:selected="${status == &#x27;EN_LIVRAISON&#x27;}">En livraison</option>
            <option value="INDISPONIBLE" th:selected="${status == &#x27;INDISPONIBLE&#x27;}">Indisponible</option>
            <option value="PAUSE" th:selected="${status == &#x27;PAUSE&#x27;}">Pause</option>
          </select>
        </label>
        <label>
          Tri
          <select name="sort">
            <option value="id,desc">Plus récents</option>
            <option value="id,asc">Plus anciens</option>
            <option value="name,asc">Nom</option>
          </select>
        </label>
        <button>Filtrer</button>
        <a th:href="@{/deliverers}">Effacer</a>
      </form>
      <table>
        <thead>
          <tr>
            <th>N°</th>
            <th>Nom</th>
            <th>Téléphone</th>
            <th>Véhicule</th>
            <th>Zone</th>
            <th>Charge maximum (kg)</th>
            <th>Volume maximum</th>
            <th>Statut</th>
            <th>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${page.content}">
            <td th:text="${row.id}">
            </td>
            <td>
              <span th:text="${row.name}">
              </span>
            </td>
            <td>
              <span th:text="${row.phone}">
              </span>
            </td>
            <td>
              <span th:text="${row.vehicle}">
              </span>
            </td>
            <td>
              <span th:text="${row.zone}">
              </span>
            </td>
            <td>
              <span th:text="${row.maxWeight}">
              </span>
            </td>
            <td>
              <span th:text="${row.maxVolume}">
              </span>
            </td>
            <td>
              <span th:text="${row.status}">
              </span>
            </td>
            <td>
              <a th:href="@{/deliverers/{id}(id=${row.id})}">Ouvrir</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(page.content)}">
            <td colspan="20">Aucun enregistrement</td>
          </tr>
        </tbody>
      </table>
      <span th:text="${page.totalElements} + &#x27; enregistrement(s)&#x27;">
      </span>
      <a th:if="${page.number &gt; 0}" th:href="@{/deliverers(page=${page.number - 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Précédent</a>
      <span th:text="${page.number + 1} + &#x27; / &#x27; + ${T(java.lang.Math).max(1,page.totalPages)}">
      </span>
      <a th:if="${page.number + 1 &lt; page.totalPages}" th:href="@{/deliverers(page=${page.number + 1},q=${q},status=${status},filter=${filter},sort=${param.sort})}">Suivant</a>
    </main>
  </body>
</html>
