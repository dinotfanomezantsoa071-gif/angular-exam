<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layout :: head}">
  </head>
  <body>
    <header th:replace="~{layout :: header}">
    </header>
    <nav th:replace="~{layout :: nav}">
    </nav>
    <main>
      <div th:replace="~{layout :: notices}">
      </div>
      <h1 th:text="${editing ? &#x27;Modifier&#x27; : &#x27;Ajouter&#x27;}">
      </h1>
      <a th:href="@{/deliverers}">Retour</a>
      <form method="post" th:action="${editing ? path + &#x27;/&#x27; + id + &#x27;/edit&#x27; : path}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          Nom
          <input name="name" type="text" required th:value="${record != null ? record.name : null}">
        </label>
        <label>
          Téléphone
          <input name="phone" type="text" required th:value="${record != null ? record.phone : null}">
        </label>
        <label>
          Véhicule
          <input name="vehicle" type="text" required th:value="${record != null ? record.vehicle : null}">
        </label>
        <label>
          Zone
          <input name="zone" type="text" required th:value="${record != null ? record.zone : null}">
        </label>
        <label>
          Charge maximum (kg)
          <input name="maxWeight" type="number" required step="0.01" min="0.01" th:value="${record != null ? record.maxWeight : null}">
        </label>
        <label>
          Volume maximum
          <input name="maxVolume" type="number" required step="0.01" min="0.01" th:value="${record != null ? record.maxVolume : null}">
        </label>
        <label>
          Distance au départ (km)
          <input name="distanceToPickup" type="number" required step="0.01" min="0" th:value="${record != null ? record.distanceToPickup : null}">
        </label>
        <label>
          Livraisons maximum
          <input name="maxDeliveries" type="number" required min="1" th:value="${record != null ? record.maxDeliveries : null}">
        </label>
        <label>
          Statut
          <select name="status">
            <option value="DISPONIBLE" th:selected="${record != null and record.status == &#x27;DISPONIBLE&#x27;}">Disponible</option>
            <option value="EN_LIVRAISON" th:selected="${record != null and record.status == &#x27;EN_LIVRAISON&#x27;}">En livraison</option>
            <option value="INDISPONIBLE" th:selected="${record != null and record.status == &#x27;INDISPONIBLE&#x27;}">Indisponible</option>
            <option value="PAUSE" th:selected="${record != null and record.status == &#x27;PAUSE&#x27;}">Pause</option>
          </select>
        </label>
        <button>Enregistrer</button>
        <a th:href="@{/deliverers}">Annuler</a>
      </form>
    </main>
  </body>
</html>
